<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Denúncia Enviada</title>
<style>
    body {
        font-family: Arial, sans-serif;
        background: #f4f8f6;
        color: #333;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        margin: 0;
    }
    .card {
        background: white;
        padding: 40px;
        border-radius: 10px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        max-width: 500px;
        text-align: center;
    }
    h1 {
        color: #00665f;
    }
    .protocolo {
        background: #e0f2f1;
        padding: 15px;
        border-radius: 5px;
        font-size: 20px;
        font-weight: bold;
        color: #00665f;
        margin: 20px 0;
        letter-spacing: 1px;
    }
    a {
        color: #00665f;
    }
</style>
</head>
<body>

<div class="card">
    <h1>Denúncia recebida</h1>
    <p>Sua denúncia foi registrada com sucesso e será analisada pela equipe responsável.</p>

    <div class="protocolo" id="protocoloBox">Carregando protocolo...</div>

    <p>Guarde este número de protocolo para eventual acompanhamento.</p>
    <p><a href="index.html">Voltar ao início</a></p>
</div>

<script>
    const params = new URLSearchParams(window.location.search);
    const protocolo = params.get('protocolo');
    document.getElementById('protocoloBox').textContent = protocolo
        ? 'Protocolo: ' + protocolo
        : 'Protocolo não disponível';
</script>

</body>
</html>
